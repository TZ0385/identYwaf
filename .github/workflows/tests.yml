name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate database
        run: python -B identYwaf.py --validate
      - name: Run tests
        run: python -B -m unittest discover -s tests -p 'test_*.py'

  python2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate database and run tests on Python 2.7
        run: |
          docker run --rm \
            --volume "$PWD:/work" \
            --workdir /work \
            python:2.7 \
            sh -c "python -B identYwaf.py --validate && python -B -m unittest discover -s tests -p 'test_*.py'"
